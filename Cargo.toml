[package]
name = "atlas-sdk"
version = "1.2.0"
edition = "2024"
description = "Strongly-typed local MCP SDK for Atlas on macOS (Unofficial)"
license = "MIT"
repository = "https://github.com/i5NWkv9NH1/atlas-sdk-rs"
exclude = ["tests/*"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls"] }
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt", "macros", "time", "process", "fs"] }
